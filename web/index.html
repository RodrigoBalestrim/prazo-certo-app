<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prazo Certo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#174d3b;--green2:#2a9167;--cream:#f5f8f3;--ink:#18392e;--muted:#718078;--gold:#e9b34f;--line:#dfe9e2}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px Inter,system-ui,-apple-system,Segoe UI,sans-serif}.hidden{display:none!important}.shell{min-height:100vh}.top{background:var(--green);color:white;padding:28px 5vw 54px}.topbar{max-width:1240px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:27px;font-weight:900;letter-spacing:.5px}.user{display:flex;align-items:center;gap:12px}.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:#dceee5}.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(.97)}.btn-primary{background:var(--gold);color:#244735}.btn-light{background:#e8f2ec;color:var(--green)}.btn-danger{background:#fae4e0;color:#9b3f35}.btn:disabled{opacity:.5;cursor:not-allowed}.hero{max-width:1240px;margin:40px auto 0}.hero h1{font-size:40px;margin:0 0 8px}.hero p{margin:0;color:#d6e9df}.main{max-width:1240px;margin:-28px auto 50px;padding:0 24px}.panel{background:white;border:1px solid var(--line);border-radius:22px;box-shadow:0 12px 30px #164d3b12}.stats{display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden}.stat{padding:23px;text-align:center;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat strong{font-size:30px;display:block}.stat span{color:var(--muted)}.toolbar{margin-top:20px;padding:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.search{flex:1;min-width:240px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;font-size:15px}.select{padding:13px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink)}.group{margin-top:20px;padding:24px}.group-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:16px}.group-head h2{margin:0}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{position:relative;display:grid;grid-template-columns:90px 1fr;gap:18px;padding:18px;border:1px solid var(--line);border-radius:18px;background:#fff}.card img,.placeholder{width:90px;height:90px;border-radius:15px;object-fit:cover;background:#eef5f0}.placeholder{display:grid;place-items:center;color:#8da99a;font-size:28px}.card h3{margin:0 0 7px;font-size:19px}.meta{color:var(--muted);margin:5px 0}.tag{display:inline-block;background:#e7f3eb;color:#23734f;padding:5px 9px;border-radius:9px;font-weight:800;font-size:12px}.status{font-weight:800;margin-top:9px}.status.green{color:#1e7a55}.status.orange{color:#b66a10}.status.red{color:#b33d32}.edit{position:absolute;right:14px;bottom:14px;border:0;border-radius:50%;width:40px;height:40px;background:#e8f3ed;color:#287b59;font-size:18px;cursor:pointer}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#174d3b,#2a9167)}.login{width:min(430px,100%);background:white;border-radius:24px;padding:34px;box-shadow:0 20px 60px #092b1d55}.login h1{margin:0 0 8px;font-size:32px}.login p{color:var(--muted)}.login input{width:100%;padding:13px;margin:7px 0;border:1px solid var(--line);border-radius:11px;font-size:15px}.login .btn{width:100%;margin-top:10px}.error{color:#b33d32;margin-top:12px}.modal-bg{position:fixed;inset:0;background:#0c251c88;display:grid;place-items:center;padding:20px}.modal{width:min(560px,100%);background:white;border-radius:22px;padding:24px}.modal h2{margin-top:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-weight:700}.form-grid input,.form-grid select{width:100%;padding:12px;margin-top:6px;border:1px solid var(--line);border-radius:10px}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}@media(max-width:800px){.cards{grid-template-columns:1fr}.hero h1{font-size:30px}.stats{grid-template-columns:1fr}.stat{border-right:0;border-bottom:1px solid var(--line)}.topbar{align-items:flex-start;flex-direction:column}.user{width:100%;justify-content:space-between}}
</style></head>
<body><div id="app"></div>
<script>
const URL="https://lranrivzxemkwybtnvww.supabase.co",KEY="sb_publishable_VhCkk-QIKGwrxGaBRcZrkA_3UhMUpNP",db=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});let session=null,company=null,products=[],editing=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateBR=s=>new Intl.DateTimeFormat('pt-BR',{timeZone:'UTC'}).format(new Date(s+'T12:00:00Z'));
const days=s=>Math.ceil((new Date(s+'T00:00:00')-new Date(new Date().setHours(0,0,0,0)))/86400000);
function status(p){let d=days(p.expires_at);if(d<0)return['Vencido','red'];if(d<=3)return['Vence em '+d+' dias','orange'];return['Vence em '+d+' dias','green']}
function login(){document.getElementById('app').innerHTML=`<main class="login-wrap"><section class="login"><h1>Prazo Certo</h1><p>Controle produtos e validade do seu grupo.</p><button class="btn btn-light" id="google">Entrar com Google</button><div style="text-align:center;margin:18px 0;color:#9aa8a0">ou</div><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button class="btn btn-primary" id="enter">Entrar</button><div id="err" class="error"></div></section></main>`;google.onclick=async()=>{let r=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)err.textContent=r.error.message};enter.onclick=async()=>{let r=await db.auth.signInWithPassword({email:email.value,password:password.value});if(r.error)err.textContent=r.error.message}}
async function load(){let m=await db.from('organization_members').select('role,organizations(id,name,company_name,sector,company_logo_url,invite_code)').limit(1).maybeSingle();company=m.data?.organizations||null;let q=db.from('products').select('*').or('archived.is.null,archived.eq.false').order('expires_at');q=company?q.eq('organization_id',company.id):q.eq('user_id',session.user.id).is('organization_id',null);let r=await q;if(r.error)throw r.error;products=r.data||[];render()}
function render(){let name=session.user.user_metadata?.full_name||session.user.email?.split('@')[0]||'Usuário',avatar=session.user.user_metadata?.avatar_url||'';document.getElementById('app').innerHTML=`<div class="shell"><header class="top"><div class="topbar"><div class="brand">PRAZO CERTO</div><div class="user"><img class="avatar" src="${esc(avatar)}" onerror="this.style.display='none'"><span>${esc(name)}</span><button class="btn btn-light" id="out">Sair</button></div></div><div class="hero"><h1>Seus produtos</h1><p>${esc(company?.name||'Lista pessoal')} · ${products.length} itens cadastrados</p></div></header><main class="main"><section class="panel stats"><div class="stat"><strong id="expired">0</strong><span>Vencidos</span></div><div class="stat"><strong id="near">0</strong><span>Próximos</span></div><div class="stat"><strong id="ok">0</strong><span>Em dia</span></div></section><section class="panel toolbar"><input class="search" id="search" placeholder="Buscar produto, marca ou código"><select class="select" id="filter"><option value="">Todas categorias</option><option>Mercearia</option><option>Açougue</option><option>Frios/PAS</option><option>Bazar</option><option>Saudáveis</option><option>FLV</option></select><button class="btn btn-primary" id="refresh">Atualizar</button></section><section class="panel group"><div class="group-head"><h2>Produtos do grupo</h2><span id="count" class="tag"></span></div><div id="cards" class="cards"></div></section></main></div>`;out.onclick=()=>db.auth.signOut();refresh.onclick=load;search.oninput=draw;filter.onchange=draw;draw()}
function draw(){let term=(search?.value||'').toLowerCase(),cat=filter?.value||'',list=products.filter(p=>(!cat||p.category===cat)&&[p.name,p.brand,p.barcode].join(' ').toLowerCase().includes(term));let c=[0,0,0];products.forEach(p=>{let d=days(p.expires_at);d<0?c[0]++:d<=30?c[1]++:c[2]++});expired.textContent=c[0];near.textContent=c[1];ok.textContent=c[2];count.textContent=list.length+' exibidos';cards.innerHTML=list.length?list.map(card).join(''):'<p style="color:var(--muted)">Nenhum produto encontrado.</p>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(products.find(p=>p.id===b.dataset.edit)))}
function card(p){let [label,cl]=status(p),image=p.photo_cutout_url||p.image_url;return `<article class="card">${image?`<img src="${esc(image)}">`:'<div class="placeholder">▦</div>'}<div><h3>${esc(p.name)}</h3><span class="tag">${esc(p.category||'Mercearia')}</span><p class="meta">Validade: ${dateBR(p.expires_at)}</p><p class="meta">${p.quantity} un. · ${esc(p.barcode||'Sem código')}</p><div class="status ${cl}">${label}</div>${p.rebaixa_aprovada?'<div class="status green">✓ Rebaixa aprovada · '+dateBR(p.rebaixa_data.slice(0,10))+'</div>':''}</div><button class="edit" data-edit="${esc(p.id)}" title="Editar">✎</button></article>`}
function openEdit(p){editing=p;document.body.insertAdjacentHTML('beforeend',`<div class="modal-bg" id="modal"><section class="modal"><h2>Editar produto</h2><div class="form-grid"><label>Nome<input id="fName" value="${esc(p.name)}"></label><label>Categoria<select id="fCat">${['Mercearia','Açougue','Frios/PAS','Bazar','Saudáveis','FLV'].map(x=>`<option ${x===p.category?'selected':''}>${x}</option>`).join('')}</select></label><label>Validade<input id="fDate" type="date" value="${p.expires_at}"></label><label>Quantidade<input id="fQty" type="number" min="1" value="${p.quantity}"></label><label style="grid-column:1/-1">Código de barras<input id="fBar" value="${esc(p.barcode)}"></label></div><div class="modal-actions"><button class="btn" id="cancel">Cancelar</button><button class="btn btn-primary" id="save">Salvar</button></div></section></div>`);cancel.onclick=()=>modal.remove();save.onclick=saveEdit}
async function saveEdit(){let patch={name:fName.value.trim(),category:fCat.value,expires_at:fDate.value,quantity:Number(fQty.value),barcode:fBar.value.trim()};if(!patch.name||!patch.expires_at||patch.quantity<1)return;save.disabled=true;let r=await db.from('products').update(patch).eq('id',editing.id);if(r.error){alert(r.error.message);save.disabled=false;return}modal.remove();await load()}
db.auth.getSession().then(({data})=>{session=data.session;session?load().catch(e=>alert(e.message)):login()});db.auth.onAuthStateChange((_e,s)=>{session=s;if(s)load()});
</script></body></html>
