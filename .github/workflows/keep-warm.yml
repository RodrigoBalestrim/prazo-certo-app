# Mantem acordadas as APIs gratuitas:
# - Render free (remocao de fundo) dorme apos ~15 min sem trafego.
# - Supabase Free hiberna/fria apos ficar ocioso; cold start deixa o
#   login lento (primeira chamada demora). Ping a cada 10 min evita.
name: Keep APIs warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Background Removal API
        run: curl -fsS "https://prazo-certo-app.onrender.com/" > /dev/null || true

      - name: Ping Supabase (GoTrue/auth)
        run: curl -fsS "https://lranrivzxemkwybtnvww.supabase.co/auth/v1/health" > /dev/null || true

      - name: Ping Supabase (PostgREST/DB)
        run: |
          curl -fsS "https://lranrivzxemkwybtnvww.supabase.co/rest/v1/products?select=id&limit=1" \
            -H "apikey: sb_publishable_VhCkk-QIKGwrxGaBRcZrkA_3UhMUpNP" \
            -H "Authorization: Bearer sb_publishable_VhCkk-QIKGwrxGaBRcZrkA_3UhMUpNP" > /dev/null || true