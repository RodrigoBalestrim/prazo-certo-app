# Compila o APK gratuitamente no GitHub Actions (sem depender da nuvem do EAS).
# Repositório público = minutos grátis e ilimitados.
# Como usar: aba Actions -> "Build APK (local)" -> "Run workflow" -> baixar o artefato.
name: Build APK (local)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android (prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: prazo-certo-apk
          path: android/app/build/outputs/apk/debug/*.apk
