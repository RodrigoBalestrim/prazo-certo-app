# Compila o APK gratuitamente no GitHub Actions (sem depender da nuvem do EAS).
# Repositório público = minutos grátis e ilimitados.
# Como usar: aba Actions -> "Build APK (local)" -> "Run workflow" -> baixar o artefato.

name: Build APK (local)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://lranrivzxemkwybtnvww.supabase.co
      EXPO_PUBLIC_SUPABASE_KEY: sb_publishable_VhCkk-QIKGwrxGaBRcZrkA_3UhMUpNP
      EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android (prebuild)
        run: npx expo prebuild --platform android --no-install

      # IMPORTANTE: build debug por padrão NÃO embute o JS (espera o Metro).
      # Sem isso, o APK instalado sozinho fica preso na splash.
      # debuggableVariants = [] força o bundle JS dentro do APK debug.
      # Keystore debug fixo commitado no repo: mesma assinatura em todos os
      # builds. Sem isso, cada runner gera chave nova e instalar por cima
      # falha (obriga desinstalar e apaga os dados locais do app).
      - name: Usar keystore debug fixo
        run: |
          mkdir -p "$HOME/.android"
          cp debug.keystore "$HOME/.android/debug.keystore"

      - name: Embutir bundle JS no APK debug
        run: |
          python3 - <<'EOF'
          p = "android/app/build.gradle"
          s = open(p, encoding="utf-8").read()
          if "debuggableVariants = []" not in s:
              s = s.replace("react {", "react {\n        debuggableVariants = []", 1)
              open(p, "w", encoding="utf-8").write(s)
              print("patched: debuggableVariants = []")
          else:
              print("ja configurado")
          EOF

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verificar JS embutido no APK
        run: |
          python3 - <<'EOF'
          import glob, zipfile
          apk = glob.glob("android/app/build/outputs/apk/debug/*.apk")[0]
          names = zipfile.ZipFile(apk).namelist()
          ok = any(n.startswith("assets/") and (n.endswith(".bundle") or n.endswith(".hbc")) for n in names)
          print("bundle JS presente:", ok)
          if not ok:
              raise SystemExit("APK sem bundle JS - app nao abre")
          EOF

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: prazo-certo-apk
          path: android/app/build/outputs/apk/debug/*.apk